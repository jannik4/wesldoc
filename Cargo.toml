[workspace]
resolver = "2"
members = ["crates/*", "snapshot_tests"]
exclude = ["example_packages/"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "WESL documentation generator"
repository = "https://github.com/jannik4/wesldoc"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
wesl = { git = "https://github.com/webgpu-tools/wesl-rs.git", rev = "3c94796ccf329076af6cf158727e5fa55eb3b82a", features = [
    "naga-ext",
] }
wgsl-parse = { git = "https://github.com/webgpu-tools/wesl-rs.git", rev = "3c94796ccf329076af6cf158727e5fa55eb3b82a" }
