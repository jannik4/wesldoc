<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESL Docs</title>

    <link rel="stylesheet" href="{{ crate::resolve_static_file_path(*static_root_path, "", "css/inter/inter.css") }}">
    <link rel="stylesheet" href="{{ crate::resolve_static_file_path(*static_root_path, "", "css/source_code_pro/source_code_pro.css") }}">

    <link rel="stylesheet" href="{{ crate::resolve_static_file_path(*static_root_path, "", "css/themes.css") }}">
    <link rel="stylesheet" href="{{ crate::resolve_static_file_path(*static_root_path, "", "css/styles.css") }}">
    <link rel="stylesheet" href="{{ crate::resolve_static_file_path(*static_root_path, "", "css/icons.css") }}">
    <script src="{{ crate::resolve_static_file_path(*static_root_path, "", "js/settings.js") }}"></script>
</head>

<body>
    <div class="nav">
        <a class="nav-item nav-item-bd-right muted-link" href="{{ index_file_path }}">
            WESL Docs
        </a>
        <button id="show-settings" class="nav-item nav-item-bd-left muted-link" aria-label="Show settings">
            <span class="icon icon-settings"></span>
        </button>
        {% include "settings_menu.html" %}
    </div>
    <div class="content">
        <h3 class="item-list-title" style="margin-top: 16px;">Packages</h3>
        <ul class="item-list">
            {% for package in packages %}
            <li>
                <a href="./{{ package }}/latest/{{ package }}/index.html">{{ package }}</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>

</html>
