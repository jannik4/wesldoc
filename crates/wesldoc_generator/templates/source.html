{% extends "base.html" %}

{% block content %}
{% let digits = source.lines().count().max(1).ilog10() + 1 %}
<pre class="code-block">
<code>
    {%- for (idx, line) in self.source_lines() -%}
        <a
            href="#{{ idx }}"
            id="{{ idx }}"
            class="line-number line-number-digits-{{ digits }}"
            data-nosnippet
        >
            {{- idx -}}
        </a>{{ line|safe }}
    {%- endfor -%}
</code>
</pre>
{% endblock %}
